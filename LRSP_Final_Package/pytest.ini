[pytest]
# Bare `pytest` runs the pure-Python suite under tests/ (no C build needed).
# The C<->Python equivalence tests live in mespprc_native/tests/ and require
# the native library to be built first — run them explicitly:
#     pytest mespprc_native/tests
testpaths = tests
python_files = test.py test_*.py *_test.py
norecursedirs = .git .git.bak build third_party *.egg-info .venv __pycache__
